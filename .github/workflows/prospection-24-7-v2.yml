name: Prospection IA 24h/24

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  lancer-prospection:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler agent de prospection RecuVente
        run: |
          curl -sf -X POST "https://www.azaliexpress.com/api/domains" -H "Content-Type: application/json" -H "Authorization: Bearer ${{ secrets.PROSPECTION_SECRET }}" -d "{\"action\":\"prospection_auto\"}"
