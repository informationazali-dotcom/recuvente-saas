<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Titre, icône, manifeste et couleur de barre sont VOLONTAIREMENT neutres ici :
       avant, ils étaient en dur au nom de RecuVente et s'affichaient (onglet, barre du
       navigateur) le temps que la boutique charge. Le script juste en dessous les pose
       immédiatement, avant le premier affichage : identité de la boutique si elle est
       connue, RecuVente uniquement pour l'admin. -->
  <title>&#8203;</title>
  <meta name="theme-color" content="#FAFAF7" />
  <!-- Démarre la connexion à la base pendant que le reste de la page se prépare -->
  <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

  <script>
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        var h = location.hostname;
        var internes = ["recuvente-saas.vercel.app", "localhost", "127.0.0.1"];
        var perso = internes.indexOf(h) === -1 && !/\.vercel\.app$/.test(h);
        var marketing = p.get("marketing");
        var suivi = p.get("suivi");
        var cle = (marketing || suivi) ? null : (p.get("commander") || p.get("catalogue") || p.get("boutique") || (perso ? h : null));
        var estBoutique = !!cle;
        var head = document.head;

        function lien(attrs) {
          var l = document.createElement("link");
          for (var k in attrs) l.setAttribute(k, attrs[k]);
          head.appendChild(l);
        }
        function meta(nom, contenu) {
          var m = document.querySelector('meta[name="' + nom + '"]');
          if (!m) { m = document.createElement("meta"); m.setAttribute("name", nom); head.appendChild(m); }
          m.setAttribute("content", contenu);
        }

        var id = null;
        if (estBoutique) {
          try { id = JSON.parse(localStorage.getItem("rv_identite_" + cle) || "null"); } catch (e) {}
        }
        window.__RV = { cle: cle, boutique: estBoutique, id: id };

        if (estBoutique) {
          // ----- BOUTIQUE : jamais la marque RecuVente -----
          var nom = id && id.nom;
          if (!nom && p.get("boutique")) {
            nom = p.get("boutique").replace(/[-_]+/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
          }
          document.title = nom || (perso ? h : "Boutique");
          if (id && id.logo) {
            // Même adresse que celle posée ensuite par CataloguePublic : aucun double téléchargement
            var u = id.logo + (id.logo.indexOf("?") >= 0 ? "&" : "?") + "v=" + encodeURIComponent(cle);
            lien({ rel: "icon", type: "image/png", sizes: "192x192", href: u });
            lien({ rel: "icon", type: "image/png", sizes: "512x512", href: u });
            lien({ rel: "apple-touch-icon", href: u });
          } else {
            // Icône transparente : l'onglet reste vide au lieu d'afficher le logo de la plateforme
            lien({ rel: "icon", href: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" });
          }
          if (id && id.couleur) meta("theme-color", id.couleur);
        } else if (suivi) {
          // Suivi de commande : neutre aussi (la boutique concernée n'est pas connue à ce stade)
          document.title = "Suivi de commande";
          lien({ rel: "icon", href: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" });
        } else {
          // ----- ADMIN et MARKETING : ici, et seulement ici, c'est RecuVente -----
          document.title = "RecuVente SaaS";
          lien({ rel: "icon", type: "image/png", sizes: "192x192", href: "/icon-192.png" });
          lien({ rel: "icon", type: "image/png", sizes: "512x512", href: "/icon-512.png" });
          lien({ rel: "apple-touch-icon", href: "/icon-192.png" });
          lien({ rel: "manifest", href: "/manifest.json" });
          meta("theme-color", "#1a7a3c");
        }

        // Les polices Google servent uniquement à l'admin (les boutiques utilisent la police
        // du système). Avant, cette feuille de style bloquait le premier affichage de TOUTES
        // les boutiques. Insérée par script, elle ne bloque plus rien.
        if (!estBoutique) {
          lien({ rel: "preconnect", href: "https://fonts.googleapis.com" });
          lien({ rel: "preconnect", href: "https://fonts.gstatic.com", crossorigin: "" });
          lien({ rel: "stylesheet", href: "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" });
        }

        // Le fond de la page prend tout de suite la couleur de la boutique (rebond iOS, coins d'écran)
        if (estBoutique && id && id.couleur && (id.logo || id.nom)) {
          document.documentElement.style.background = id.couleur;
        }
      } catch (e) {}
    })();
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
    #root { width: 100%; }
    body { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }

    /* Le tableau de bord admin a été conçu pour mobile ; sur grand écran (PC),
       tout paraissait minuscule. On agrandit uniquement cette vue, pas la boutique publique. */
    @media (min-width: 1024px) {
      body.rv-admin-app {
        zoom: 1.1;
      }
    }

    /* Écran d'amorce : identique à celui que React affiche ensuite (voir AmorceBoutique.jsx),
       pour que le passage de l'un à l'autre soit invisible. */
    .rvb{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--rvb-bg,#FAFAF7);color:var(--rvb-fg,#16231F);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .rvb-med{position:relative;width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 14px 44px rgba(0,0,0,.20)}
    .rvb-med img{width:64%;height:64%;object-fit:contain;display:block}
    .rvb-ini{font-weight:800;font-size:34px;color:var(--rvb-bg,#16231F)}
    .rvb-ring{position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,var(--rvb-fg,#fff),transparent 72%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));animation:rvbSpin 1.3s linear infinite;opacity:.9}
    .rvb-nom{font-weight:650;font-size:15px;letter-spacing:.02em;opacity:.92;max-width:80vw;text-align:center}
    .rvb-fil{position:absolute;left:0;top:0;height:2px;width:100%;transform-origin:left;background:var(--rvb-fg,#16231F);opacity:.5;animation:rvbFil 1.6s cubic-bezier(.4,0,.2,1) infinite}
    .rvb-neutre .rvb-fil{opacity:.28}
    @keyframes rvbSpin{to{transform:rotate(360deg)}}
    @keyframes rvbFil{0%{transform:scaleX(0);opacity:.5}60%{transform:scaleX(1);opacity:.5}100%{transform:scaleX(1);opacity:0}}
    @media (prefers-reduced-motion:reduce){.rvb-ring,.rvb-fil{animation:none}}
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Amorce : s'exécute avant même le téléchargement de React. Le visiteur voit tout de
       suite les couleurs et le logo de LA BOUTIQUE (jamais ceux de la plateforme).
       React remplace ce contenu par un écran identique dès qu'il démarre. -->
  <script>
    (function () {
      try {
        var R = window.__RV;
        if (!R || !R.boutique) return;
        var root = document.getElementById("root");
        if (!root) return;
        var id = R.id;
        var brande = !!(id && (id.logo || id.nom));

        function lum(hex) {
          var h = String(hex || "").replace("#", "");
          if (h.length === 3) h = h.replace(/./g, function (c) { return c + c; });
          if (!/^[0-9a-f]{6}$/i.test(h)) return 0;
          var v = [0, 2, 4].map(function (i) {
            var c = parseInt(h.substr(i, 2), 16) / 255;
            return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
        }

        var bg = brande ? (id.couleur || "#1a7a3c") : "#FAFAF7";
        var fg = brande ? (lum(bg) > 0.45 ? "#16231F" : "#FFFFFF") : "#16231F";

        var ecran = document.createElement("div");
        ecran.className = "rvb" + (brande ? "" : " rvb-neutre");
        ecran.style.setProperty("--rvb-bg", bg);
        ecran.style.setProperty("--rvb-fg", fg);

        var fil = document.createElement("div");
        fil.className = "rvb-fil";
        ecran.appendChild(fil);

        if (brande) {
          var med = document.createElement("div");
          med.className = "rvb-med";
          var ring = document.createElement("i");
          ring.className = "rvb-ring";
          med.appendChild(ring);
          if (id.logo) {
            var img = document.createElement("img");
            img.setAttribute("alt", "");
            img.setAttribute("decoding", "async");
            img.setAttribute("src", id.logo);
            med.appendChild(img);
          } else {
            var ini = document.createElement("span");
            ini.className = "rvb-ini";
            ini.textContent = (id.nom || "").trim().charAt(0).toUpperCase();
            med.appendChild(ini);
          }
          ecran.appendChild(med);
          if (id.nom) {
            var n = document.createElement("div");
            n.className = "rvb-nom";
            n.textContent = id.nom;
            ecran.appendChild(n);
          }
        }
        root.appendChild(ecran);
      } catch (e) {}
    })();
  </script>

  <script type="module" src="/main.jsx"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
