<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Titre, icône, manifeste et couleur de barre sont VOLONTAIREMENT neutres ici :
       avant, ils étaient en dur au nom de RecuVente et s'affichaient (onglet, barre du
       navigateur) le temps que la boutique charge. Le script juste en dessous les pose
       immédiatement, avant le premier affichage : identité de la boutique si elle est
       connue, RecuVente uniquement pour l'admin. -->
  <title>&#8203;</title>
  <meta name="theme-color" content="#FAFAF7" />
  <!-- Démarre la connexion à la base pendant que le reste de la page se prépare -->
  <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

  <script>
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        var h = location.hostname;
        var internes = ["recuvente-saas.vercel.app", "localhost", "127.0.0.1"];
        var perso = internes.indexOf(h) === -1 && !/\.vercel\.app$/.test(h);
        var marketing = p.get("marketing");
        var suivi = p.get("suivi");
        var cle = (marketing || suivi) ? null : (p.get("commander") || p.get("catalogue") || p.get("boutique") || (perso ? h : null));
        var estBoutique = !!cle;
        var head = document.head;

        function lien(attrs) {
          var l = document.createElement("link");
          for (var k in attrs) l.setAttribute(k, attrs[k]);
          head.appendChild(l);
        }
        function meta(nom, contenu) {
          var m = document.querySelector('meta[name="' + nom + '"]');
          if (!m) { m = document.createElement("meta"); m.setAttribute("name", nom); head.appendChild(m); }
          m.setAttribute("content", contenu);
        }

        var id = null;
        if (estBoutique) {
          try { id = JSON.parse(localStorage.getItem("rv_identite_" + cle) || "null"); } catch (e) {}
        }
        // ----- Réseaux nationaux (ex. Miss & Mister Excellence) : identité et application propres -----
        var RESEAUX = {
          "miss-mister-excellence": {
            nom: "Miss & Mister Excellence Côte d'Ivoire", court: "Miss & Mister Excellence", logo: "/logo-mme.png",
            couleur: "#3D0C52", icone: "/excellence/icone-192.png", icone180: "/excellence/icone-180.png", icone512: "/excellence/icone-512.png",
            manifeste: { boutique: "/excellence/manifest.json", representant: "/excellence/manifest-representants.json", vendeur: "/excellence/manifest-vendeurs.json" },
            appli: { boutique: "Excellence CI", representant: "MME Représentants", vendeur: "MME Partenaires" }
          }
        };
        var CHEMINS = { excellence: "miss-mister-excellence", guides: "miss-mister-excellence" };
        var reseau = p.get("reseau") || CHEMINS[location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase()] || null;
        var idReseau = reseau ? (RESEAUX[reseau] || null) : null;
        var espace = p.get("espace") === "representant" ? "representant" : p.get("espace") === "vendeur" ? "vendeur" : "boutique";
        window.__RV = { cle: cle, boutique: estBoutique, id: id, reseau: reseau, idReseau: idReseau, espace: espace };

        // ----- Démarrage anticipé (boutique publique uniquement) -----
        // Avant : téléchargement du code → 2 requêtes l'une après l'autre → seulement alors le
        // Pixel Facebook. Sur un réseau mobile lent (ou dans le navigateur intégré de Facebook),
        // beaucoup de visiteurs partaient avant le PageView : Facebook comptait des clics mais
        // pas de visites. Ici, tout démarre dès l'ouverture de la page, EN PARALLÈLE du code.
        // Tout est facultatif : au moindre problème, la boutique fait exactement comme avant.
        if (estBoutique && !p.get("commander") && window.fetch) {
          var demarrerFb = function (pid) {
            if (!pid || window.fbq || !/^[0-9]{5,20}$/.test(String(pid))) return;
            !function (f, b, e, v, n, t, s) {
              if (f.fbq) return;
              n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };
              if (!f._fbq) f._fbq = n;
              n.push = n; n.loaded = !0; n.version = "2.0"; n.queue = [];
              t = b.createElement(e); t.async = !0; t.src = v;
              s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
            }(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
            window.__RV_FB = String(pid);
            window.fbq("init", String(pid));
            window.fbq("track", "PageView");
          };
          try {
            // Boutique déjà visitée : le Pixel est connu, il démarre tout de suite.
            if (id && id.fb) {
              lien({ rel: "preconnect", href: "https://connect.facebook.net" });
              demarrerFb(id.fb);
            }
            var DB = "%VITE_SUPABASE_URL%", KEY = "%VITE_SUPABASE_ANON_KEY%";
            if (DB.indexOf("%") === -1 && KEY.indexOf("%") === -1 && DB.length > 8 && KEY.length > 8) {
              var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
              var pre = window.__RV_PRE = { cle: null, fn: null, ws: null, wsId: null, cat: null, tem: null, col: null };
              var H = { "Content-Type": "application/json", apikey: KEY };
              if (/^eyJ/.test(KEY)) H.Authorization = "Bearer " + KEY;
              var rpc = function (fn, corps) {
                return fetch(DB + "/rest/v1/rpc/" + fn, { method: "POST", headers: H, body: JSON.stringify(corps) })
                  .then(function (r) { return r.ok ? r.json() : null; })
                  .catch(function () { return null; });
              };
              var direct = p.get("catalogue"), slugUrl = p.get("boutique");
              if (direct) {
                if (UUID.test(direct)) { pre.wsId = direct; pre.ws = Promise.resolve(direct); }
              } else if (slugUrl) {
                pre.cle = slugUrl; pre.fn = "slug"; pre.ws = rpc("workspace_id_par_slug", { p_slug: slugUrl });
              } else if (perso) {
                pre.cle = h; pre.fn = "domaine"; pre.ws = rpc("workspace_id_par_domaine", { p_domaine: h });
              }
              if (pre.ws) {
                pre.ws = pre.ws.then(function (v) {
                  if (typeof v === "string" && UUID.test(v)) { pre.wsId = v; return v; }
                  return null;
                });
                pre.cat = pre.ws.then(function (v) { return v ? rpc("catalogue_public", { p_workspace_id: v }) : null; });
                pre.tem = pre.ws.then(function (v) { return v ? rpc("temoignages_publics", { p_workspace_id: v }) : null; });
                pre.col = pre.ws.then(function (v) { return v ? rpc("collections_publiques", { p_workspace_id: v }) : null; });
                // Première visite : le Pixel démarre dès que la boutique répond, sans attendre le code.
                pre.cat.then(function (d) { try { if (d && d[0]) demarrerFb(d[0].facebook_pixel_id); } catch (e) {} });
              }
            }
          } catch (e) {}
        }

        if (reseau) {
          // ----- RÉSEAU NATIONAL : identité officielle, application installable dédiée -----
          var R0 = idReseau || {};
          document.title = (R0.nom || "Boutique") + (espace === "representant" ? " — Espace représentant" : espace === "vendeur" ? " — Espace partenaire" : "");
          if (R0.icone) {
            lien({ rel: "icon", type: "image/png", sizes: "192x192", href: R0.icone });
            lien({ rel: "apple-touch-icon", sizes: "180x180", href: R0.icone180 || R0.icone });
          }
          if (R0.manifeste) lien({ rel: "manifest", href: R0.manifeste[espace] });
          meta("theme-color", R0.couleur || "#3D0C52");
          meta("mobile-web-app-capable", "yes");
          meta("apple-mobile-web-app-capable", "yes");
          meta("apple-mobile-web-app-status-bar-style", "black-translucent");
          meta("apple-mobile-web-app-title", (R0.appli && R0.appli[espace]) || R0.court || "Boutique");
          meta("application-name", (R0.appli && R0.appli[espace]) || R0.court || "Boutique");
          lien({ rel: "preconnect", href: "https://fonts.googleapis.com" });
          lien({ rel: "preconnect", href: "https://fonts.gstatic.com", crossorigin: "" });
          lien({ rel: "stylesheet", href: "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Public+Sans:wght@400;500;600;700&display=swap" });
          if (R0.logo) lien({ rel: "preload", as: "image", href: R0.logo });
          if (R0.couleur) document.documentElement.style.background = R0.couleur;
          // Installation de l'application : on garde la proposition du navigateur pour l'offrir
          // au bon moment, avec notre propre bouton « Installer l'application ».
          window.addEventListener("beforeinstallprompt", function (ev) {
            ev.preventDefault();
            window.__rvInstall = ev;
            window.dispatchEvent(new Event("rv-installable"));
          });
          window.addEventListener("appinstalled", function () {
            window.__rvInstall = null;
            try { localStorage.setItem("rv_appli_installee_" + reseau, "1"); } catch (e) {}
            window.dispatchEvent(new Event("rv-installable"));
          });
        } else if (estBoutique) {
          // ----- BOUTIQUE : jamais la marque RecuVente -----
          var nom = id && id.nom;
          if (!nom && p.get("boutique")) {
            nom = p.get("boutique").replace(/[-_]+/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
          }
          document.title = nom || (perso ? h : "Boutique");
          if (id && id.logo) {
            // Même adresse que celle posée ensuite par CataloguePublic : aucun double téléchargement
            var u = id.logo + (id.logo.indexOf("?") >= 0 ? "&" : "?") + "v=" + encodeURIComponent(cle);
            lien({ rel: "icon", type: "image/png", sizes: "192x192", href: u });
            lien({ rel: "icon", type: "image/png", sizes: "512x512", href: u });
            lien({ rel: "apple-touch-icon", href: u });
          } else {
            // Icône transparente : l'onglet reste vide au lieu d'afficher le logo de la plateforme
            lien({ rel: "icon", href: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" });
          }
          if (id && id.couleur) meta("theme-color", id.couleur);
        } else if (suivi) {
          // Suivi de commande : neutre aussi (la boutique concernée n'est pas connue à ce stade)
          document.title = "Suivi de commande";
          lien({ rel: "icon", href: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" });
        } else {
          // ----- ADMIN et MARKETING : ici, et seulement ici, c'est RecuVente -----
          document.title = "RecuVente SaaS";
          lien({ rel: "icon", type: "image/png", sizes: "192x192", href: "/icon-192.png" });
          lien({ rel: "icon", type: "image/png", sizes: "512x512", href: "/icon-512.png" });
          lien({ rel: "apple-touch-icon", href: "/icon-192.png" });
          lien({ rel: "manifest", href: "/manifest.json" });
          meta("theme-color", "#1a7a3c");
        }

        // Les polices Google servent uniquement à l'admin (les boutiques utilisent la police
        // du système). Avant, cette feuille de style bloquait le premier affichage de TOUTES
        // les boutiques. Insérée par script, elle ne bloque plus rien.
        if (!estBoutique && !reseau) {
          lien({ rel: "preconnect", href: "https://fonts.googleapis.com" });
          lien({ rel: "preconnect", href: "https://fonts.gstatic.com", crossorigin: "" });
          lien({ rel: "stylesheet", href: "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" });
        }

        // Le fond de la page prend tout de suite la couleur de la boutique (rebond iOS, coins d'écran)
        if (estBoutique && id && id.couleur && (id.logo || id.nom)) {
          document.documentElement.style.background = id.couleur;
        }
      } catch (e) {}
    })();
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
    #root { width: 100%; }
    body { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }

    /* Le tableau de bord admin a été conçu pour mobile ; sur grand écran (PC),
       tout paraissait minuscule. On agrandit uniquement cette vue, pas la boutique publique. */
    @media (min-width: 1024px) {
      body.rv-admin-app {
        zoom: 1.1;
      }
    }

    /* Écran d'amorce : identique à celui que React affiche ensuite (voir AmorceBoutique.jsx),
       pour que le passage de l'un à l'autre soit invisible. */
    .rvb{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--rvb-bg,#FAFAF7);color:var(--rvb-fg,#16231F);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .rvb-med{position:relative;width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 14px 44px rgba(0,0,0,.20)}
    .rvb-med img{width:64%;height:64%;object-fit:contain;display:block}
    .rvb-ini{font-weight:800;font-size:34px;color:var(--rvb-bg,#16231F)}
    .rvb-ring{position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,var(--rvb-fg,#fff),transparent 72%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));animation:rvbSpin 1.3s linear infinite;opacity:.9}
    .rvb-nom{font-weight:650;font-size:15px;letter-spacing:.02em;opacity:.92;max-width:80vw;text-align:center}
    .rvb-fil{position:absolute;left:0;top:0;height:2px;width:100%;transform-origin:left;background:var(--rvb-fg,#16231F);opacity:.5;animation:rvbFil 1.6s cubic-bezier(.4,0,.2,1) infinite}
    .rvb-neutre .rvb-fil{opacity:.28}
    .rvb-reseau{background:radial-gradient(80% 60% at 50% 35%,rgba(184,145,63,.28),transparent 70%),var(--rvb-bg)}
    .rvb-reseau .rvb-med{width:112px;height:112px;box-shadow:0 0 0 3px #B8913F,0 18px 50px rgba(0,0,0,.35)}
    .rvb-reseau .rvb-med img{width:100%;height:100%;border-radius:50%;object-fit:cover}
    .rvb-reseau .rvb-ring{background:conic-gradient(from 0deg,#B8913F,transparent 72%)}
    .rvb-reseau .rvb-nom{font-family:Georgia,"Times New Roman",serif;font-size:17px;letter-spacing:.04em}
    .rvb-bande{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#F77F00 0 33.3%,#fff 33.3% 66.6%,#009E60 66.6%)}
    @keyframes rvbSpin{to{transform:rotate(360deg)}}
    @keyframes rvbFil{0%{transform:scaleX(0);opacity:.5}60%{transform:scaleX(1);opacity:.5}100%{transform:scaleX(1);opacity:0}}
    @media (prefers-reduced-motion:reduce){.rvb-ring,.rvb-fil{animation:none}}
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Amorce : s'exécute avant même le téléchargement de React. Le visiteur voit tout de
       suite les couleurs et le logo de LA BOUTIQUE (jamais ceux de la plateforme).
       React remplace ce contenu par un écran identique dès qu'il démarre. -->
  <script>
    (function () {
      try {
        var R = window.__RV;
        var root = document.getElementById("root");
        if (!R || !root) return;
        if (R.reseau && R.idReseau) {
          // Écran d'ouverture officiel du réseau (identique à celui de l'application React)
          var e0 = document.createElement("div");
          e0.className = "rvb rvb-reseau";
          e0.style.setProperty("--rvb-bg", R.idReseau.couleur);
          e0.style.setProperty("--rvb-fg", "#FFFFFF");
          e0.innerHTML = '<div class="rvb-fil"></div><div class="rvb-med"><i class="rvb-ring"></i><img alt="" src="' + R.idReseau.logo + '"></div><div class="rvb-nom"></div><div class="rvb-bande"></div>';
          e0.querySelector(".rvb-nom").textContent = R.idReseau.nom;
          root.appendChild(e0);
          return;
        }
        if (!R.boutique) return;
        var id = R.id;
        var brande = !!(id && (id.logo || id.nom));

        function lum(hex) {
          var h = String(hex || "").replace("#", "");
          if (h.length === 3) h = h.replace(/./g, function (c) { return c + c; });
          if (!/^[0-9a-f]{6}$/i.test(h)) return 0;
          var v = [0, 2, 4].map(function (i) {
            var c = parseInt(h.substr(i, 2), 16) / 255;
            return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
        }

        var bg = brande ? (id.couleur || "#1a7a3c") : "#FAFAF7";
        var fg = brande ? (lum(bg) > 0.45 ? "#16231F" : "#FFFFFF") : "#16231F";

        var ecran = document.createElement("div");
        ecran.className = "rvb" + (brande ? "" : " rvb-neutre");
        ecran.style.setProperty("--rvb-bg", bg);
        ecran.style.setProperty("--rvb-fg", fg);

        var fil = document.createElement("div");
        fil.className = "rvb-fil";
        ecran.appendChild(fil);

        if (brande) {
          var med = document.createElement("div");
          med.className = "rvb-med";
          var ring = document.createElement("i");
          ring.className = "rvb-ring";
          med.appendChild(ring);
          if (id.logo) {
            var img = document.createElement("img");
            img.setAttribute("alt", "");
            img.setAttribute("decoding", "async");
            img.setAttribute("src", id.logo);
            med.appendChild(img);
          } else {
            var ini = document.createElement("span");
            ini.className = "rvb-ini";
            ini.textContent = (id.nom || "").trim().charAt(0).toUpperCase();
            med.appendChild(ini);
          }
          ecran.appendChild(med);
          if (id.nom) {
            var n = document.createElement("div");
            n.className = "rvb-nom";
            n.textContent = id.nom;
            ecran.appendChild(n);
          }
        }
        root.appendChild(ecran);
      } catch (e) {}
    })();
  </script>

  <script type="module" src="/main.jsx"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
