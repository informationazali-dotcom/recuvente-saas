<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecuVente SaaS</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a7a3c" />
  <!-- Les polices distantes bloquaient le tout premier affichage ; le préconnect
       démarre la connexion au serveur de polices pendant que le reste de la page
       se prépare, au lieu d'attendre que le navigateur la découvre plus tard. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
    #root { width: 100%; }
    body { font-family: 'IBM Plex Sans', sans-serif; }

    /* Le tableau de bord admin a été conçu pour mobile ; sur grand écran (PC),
       tout paraissait minuscule. On agrandit uniquement cette vue, pas la boutique publique. */
    @media (min-width: 1024px) {
      body.rv-admin-app {
        zoom: 1.1;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.jsx"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
